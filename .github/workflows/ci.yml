name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # lupa provides a real Lua runtime to compile against.
      - name: Install lupa
        run: python -m pip install --quiet lupa

      - name: Compile every Lua file
        run: python tests/syntaxcheck.py   # every Lua file the .toc loads
